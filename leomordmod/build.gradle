plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    // Polymer repo — needed because crownmod declares polymer as a dep,
    // and we want loom to be able to resolve it for the dev environment.
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // crownmod — provides Royal Crown item used as recipe ingredient
    // and boss head equipment. Hard runtime dep declared in fabric.mod.json.
    modImplementation files('libs/crownmod-1.0.0.jar')

    // hellimp — provides accessory slot system for FireSymbol item.
    // Optional dep — FireSymbol accessory registration is wrapped in try/catch
    // + FabricLoader.isModLoaded("hellimp") check at runtime.
    modCompileOnly files('libs/hellimp-1.0.0.jar')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
